name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Setup
        run: mise run setup

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Build WASM
        run: mise run build

      - name: Generate SBOM
        run: mise run sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: zjtabname.cdx.json
