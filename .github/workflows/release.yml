name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Setup
        run: mise run setup

      - name: Build WASM plugin
        run: mise run build

      - name: Generate SBOM
        run: mise run sbom

      - name: Rename artifacts
        run: |
          cp target/wasm32-wasip1/release/zjtabname.wasm zjtabname-${{ github.ref_name }}.wasm
          mv zjtabname.cdx.json zjtabname-${{ github.ref_name }}.cdx.json

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            zjtabname-${{ github.ref_name }}.wasm
            zjtabname-${{ github.ref_name }}.cdx.json
