[settings]
experimental = true

[tools]
rust = "latest"
"cargo:git-cliff" = "latest"
"cargo:cargo-release" = "latest"

[hooks]
enter = "rustup target add wasm32-wasip1 2>/dev/null"

[tasks.lint]
description = "Run clippy lints"
run = "cargo clippy --target $(rustc -vV | sed -n 's/host: //p') -- -D warnings"

[tasks.build]
description = "Build the WASM plugin (release)"
run = "cargo build --release"

[tasks.test]
description = "Run unit tests (native target)"
run = "cargo test --target $(rustc -vV | sed -n 's/host: //p')"

[tasks.changelog]
description = "Preview unreleased changelog entries"
run = "git cliff --unreleased"

[tasks.release-patch]
description = "Release a patch version (bug fixes)"
run = "cargo release patch --execute"

[tasks.release-minor]
description = "Release a minor version (new features)"
run = "cargo release minor --execute"

[tasks.release-major]
description = "Release a major version (breaking changes)"
run = "cargo release major --execute"

[tasks.install]
description = "Build and install the plugin to Zellij plugin directory"
depends = ["build"]
run = """
mkdir -p ~/.config/zellij/plugins
cp target/wasm32-wasip1/release/zjtabname.wasm ~/.config/zellij/plugins/
echo ""
echo "✅ Installed zjtabname.wasm to ~/.config/zellij/plugins/"
echo ""
echo "Add the following to your Zellij config to load the plugin:"
echo ""
echo '  load_plugins {'
echo '    zjtabname location="file:~/.config/zellij/plugins/zjtabname.wasm"'
echo '  }'
"""
